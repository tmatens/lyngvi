# Egress allowlist proxy for the lyngvi station (DESIGN.md, egress): the ONLY path
# out of the agent's gateway-less networks, so this file is the egress control.
# Runs as the non-root `tinyproxy` user (USER in proxy/Dockerfile) with a
# read-only rootfs.
#
# NO PidFile on purpose: tinyproxy runs in the foreground (-d) as PID 1, so a
# pidfile is useless — and writing one crash-loops the container, because the
# read-only rootfs leaves only the root-owned /run tmpfs, which uid 10002 cannot
# write ("Could not create PID file" -> exit 71). Liveness is the `pidof`
# healthcheck (docker-compose.yml), not a pidfile.

Port 3128
Listen 0.0.0.0
Timeout 600

# Logs go to stderr (no LogFile): docker logs / journald. A LogFile of /dev/stdout
# cannot be re-opened by tinyproxy and silently logs nothing.
LogLevel Connect

# Don't advertise that a proxy is in the path.
DisableViaHeader Yes

# Clients: any RFC1918 address. The real scoping is the `internal: true` network
# this proxy shares only with the agent (docker-compose.yml); tinyproxy cannot
# interpolate the subnet, and listing all private ranges loses nothing that the
# network topology does not already enforce.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Destination allowlist (default-deny). Filter applies to plain HTTP requests
# AND to the host of HTTPS CONNECT requests.
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
Filter "/etc/tinyproxy/filter"

# HTTPS only — no CONNECT to any other port.
# Ports a CONNECT may target on an allowlisted host: HTTPS, and SSH for git over
# the tunnel (ssh ProxyCommand → agent/connect.mjs). A forge on another port adds
# a `ConnectPort N` line in site/proxy-tinyproxy.extra (appended at build).
ConnectPort 443
ConnectPort 22
