# site.conf — NON-secret runtime values for one deployment, loaded by compose as
# an env_file. The upstream example (this file) runs end-to-end; an overlay ships
# its own site/site.conf. Secrets never go here — they go in .env (see
# .env.example), produced on the host by your secrets mechanism. (It is named
# .conf, not .env, so the secret-hygiene hook never mistakes it for a secrets file.)

# Git identity for the agent's commits. Use an identity that is visibly the
# agent's, not a human's; a forge noreply address keeps real addresses out of
# every commit and DCO trailer.
# This file is the only source: never set these in .env too (it loads later and
# wins silently). The image's git hooks refuse a commit under any other identity;
# per-path identities go in site/gitconfig (user.* via includeIf).
GIT_AUTHOR_NAME=lyngvi
GIT_AUTHOR_EMAIL=lyngvi@users.noreply.example.org
# 1 = add a Signed-off-by trailer to every commit (prepare-commit-msg hook).
GIT_DCO_SIGNOFF=1
# 1 = no AI attribution: Claude Code adds no co-author trailer, PR footer or
# session link ("attribution": false), and the commit-msg hook refuses them.
# Default 0: agent authorship stays visible in the log, which is the honest
# default for a governance story.
GIT_NO_AI_ATTRIBUTION=0

# Forge adapter: github | forgejo | gitea | none. Only `forgejo` has a baked MCP
# server (WITH_FORGEJO_MCP=1); the rest use the REST API from node.
FORGE_KIND=github
# forgejo-mcp tool areas to switch off (FORGE_KIND=forgejo only). Leave it
# commented for the default, admin,repo-settings: repo-settings can create push
# mirrors and webhooks, connections the forge makes itself, outside the egress
# proxy. Empty = every area on; only do that with a token that has no repo-admin
# or site-admin rights. Areas: repository, repo-settings, issues, pull-requests,
# organizations, users, actions, packages, admin (an unknown name stops the server).
#FORGEJO_DISABLED_AREAS=admin,repo-settings
# GitHub MCP server (WITH_GITHUB_MCP=1, registered when GITHUB_TOKEN is set). Leave
# these commented for lyngvi's defaults: the server's toolsets minus copilot (which
# runs GitHub's own agent outside the egress proxy) and users, and no tools that
# write commits through the API (they skip the agent's signing key and DCO hook).
# Add `actions` to read CI runs and logs. Empty = the server's own default.
#GITHUB_TOOLSETS=context,repos,issues,pull_requests
#GITHUB_EXCLUDE_TOOLS=push_files,create_or_update_file,delete_file,create_repository
# A self-hosted forge reached over SSH (empty = none). Its host key MUST be
# pinned in site/known_hosts or SSH is refused (fail closed), its name must be in
# site/proxy-filter.extra and a non-22 port in site/proxy-tinyproxy.extra (ssh
# tunnels through the proxy). The example name has a synthetic pinned key in
# site-example/known_hosts so the pinning path is exercised by the smoke; set
# your real forge here, or empty for GitHub only.
FORGE_SSH_HOST=git.example.internal
FORGE_SSH_PORT=22
# Forge REST API base (issues, PR status, CI). The example is GitHub's.
FORGE_API_BASE=https://api.github.com

# Optional skills source repo (cloned fresh each start). Empty = none. The
# installed copy is a snapshot of that start; every session start checks the
# source and warns when it has moved on.
SKILLS_REPO=
SKILLS=
PROJECT_SKILLS=

# How the agent reaches the model (docs/API_KEY_MODE.md): remote-control (default) uses the
# claude.ai subscription login and Remote Control; api-key uses an Anthropic API key held by
# the token relay (LYNGVI_ANTHROPIC_API_KEY in .env), billed per token, with no Remote
# Control: sessions are reached through tmux / docker exec.
LYNGVI_MODE=remote-control

# How often (seconds) the agent scans ~/workspace for settings files that gained an allow
# rule, hooks, a defaultMode or additionalDirectories, raising CONFIG_CHANGED sev=warn
# (DESIGN.md §4.5). 0 turns the scan off, leaving only the in-session ConfigChange hook.
#LYNGVI_CONFIG_SCAN_INTERVAL=60

# Remote Control server name (what the phone/browser shows) and capacity.
RC_NAME=lyngvi
RC_CAPACITY=8
# Name used in log hints ("docker exec -it <name> claude /login").
CONTAINER_NAME=lyngvi

# Where the watchdog's markers (RC_TOKEN_EXPIRING, RC_TOKEN_STALE, RC_REGISTER_FAIL,
# RC_RELAY_DROP, SSH_HOSTKEY_MISSING) reach a human besides this container's log.
# Empty = log only (fine when a log-alert rule watches `sev=warn|crit`). NOTIFY_URL
# is POSTed to in the NOTIFY_KIND shape (ntfy: text + Title/Priority headers;
# slack: {text}; discord: {content}; json: {title,message,priority,marker,sev}).
# A URL that embeds a token, and NOTIFY_TOKEN (an ntfy access token), go in .env
# instead. NOTIFY_CMD runs a site command with MARKER SEV MESSAGE as arguments.
# The push host must be allowlisted in site/proxy-filter.extra (every client leaves
# through the proxy). Prove delivery once: docker exec <name> notify --test
NOTIFY_URL=
NOTIFY_KIND=ntfy
NOTIFY_CMD=
# warn (default) pages 48 h before the monthly re-login; crit pages only outages.
NOTIFY_MIN_SEV=warn
# Seconds before the same marker is pushed again (the watchdog re-emits every 5 min).
NOTIFY_REPEAT=21600

# Decoy credentials (DESIGN.md §10). The agent's home gets a netrc machine, a
# git-credentials line and an ssh Host alias naming per-install hosts that are never
# allowlisted. A use is refused at the proxy and raises CANARY_TOUCHED sev=crit there,
# in a log the agent cannot write. 0 turns them off (say, after a false alarm).
CANARIES=1

# Do NOT set DISABLE_TELEMETRY / CLAUDE_CODE_USE_BEDROCK|VERTEX|FOUNDRY here —
# they disable Remote Control eligibility.
