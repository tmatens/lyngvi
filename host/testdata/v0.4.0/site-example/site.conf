# site.conf — NON-secret runtime values for one deployment, loaded by compose as
# an env_file. The upstream example (this file) runs end-to-end; an overlay ships
# its own site/site.conf. Secrets never go here — they go in .env (see
# .env.example), produced on the host by your secrets mechanism. (It is named
# .conf, not .env, so the secret-hygiene hook never mistakes it for a secrets file.)

# Git identity for the agent's commits. Use an identity that is visibly the
# agent's, not a human's; a forge noreply address keeps real addresses out of
# every commit and DCO trailer.
GIT_AUTHOR_NAME=lyngvi
GIT_AUTHOR_EMAIL=lyngvi@users.noreply.example.org
# 1 = add a Signed-off-by trailer to every commit (prepare-commit-msg hook).
GIT_DCO_SIGNOFF=1
# 1 = drop Claude Code's Co-Authored-By trailer. Default 0: agent authorship
# stays visible in the log, which is the honest default for a governance story.
GIT_NO_AI_ATTRIBUTION=0

# Forge adapter: github | forgejo | gitea | none. Only `forgejo` has a baked MCP
# server (WITH_FORGEJO_MCP=1); the rest use the REST API from node.
FORGE_KIND=github
# A self-hosted forge reached over SSH (empty = none). Its host key MUST be
# pinned in site/known_hosts or SSH is refused (fail closed), its name must be in
# site/proxy-filter.extra and a non-22 port in site/proxy-tinyproxy.extra (ssh
# tunnels through the proxy). The example name has a synthetic pinned key in
# site-example/known_hosts so the pinning path is exercised by the smoke; set
# your real forge here, or empty for GitHub only.
FORGE_SSH_HOST=git.example.internal
FORGE_SSH_PORT=22
# Forge REST API base (issues, PR status, CI). The example is GitHub's.
FORGE_API_BASE=https://api.github.com

# Optional skills source repo (cloned fresh each start). Empty = none.
SKILLS_REPO=
SKILLS=
PROJECT_SKILLS=

# Remote Control server name (what the phone/browser shows) and capacity.
RC_NAME=lyngvi
RC_CAPACITY=8
# Name used in log hints ("docker exec -it <name> claude /login").
CONTAINER_NAME=lyngvi

# Where the watchdog's markers (RC_TOKEN_EXPIRING, RC_TOKEN_STALE, RC_REGISTER_FAIL,
# RC_RELAY_DROP, SSH_HOSTKEY_MISSING) reach a human besides this container's log.
# Empty = log only (fine when a log-alert rule watches `sev=warn|crit`). NOTIFY_URL
# is POSTed to in the NOTIFY_KIND shape (ntfy: text + Title/Priority headers;
# slack: {text}; discord: {content}; json: {title,message,priority,marker,sev}).
# A URL that embeds a token, and NOTIFY_TOKEN (an ntfy access token), go in .env
# instead. NOTIFY_CMD runs a site command with MARKER SEV MESSAGE as arguments.
# The push host must be allowlisted in site/proxy-filter.extra (every client leaves
# through the proxy). Prove delivery once: docker exec <name> notify --test
NOTIFY_URL=
NOTIFY_KIND=ntfy
NOTIFY_CMD=
# warn (default) pages 48 h before the monthly re-login; crit pages only outages.
NOTIFY_MIN_SEV=warn
# Seconds before the same marker is pushed again (the watchdog re-emits every 5 min).
NOTIFY_REPEAT=21600

# Do NOT set DISABLE_TELEMETRY / CLAUDE_CODE_USE_BEDROCK|VERTEX|FOUNDRY here —
# they disable Remote Control eligibility.
